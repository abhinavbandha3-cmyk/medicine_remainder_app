{% extends "layout.html" %}
{% block title %}Add Medicine{% endblock %}
{% block page_title %}Add Medicine{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 720px;">
    <h6 class="fw-bold mb-3" style="color:var(--navy-deep)"><i class="fa-solid fa-pills me-2"></i>New Medicine</h6>
    <form method="POST" action="{{ url_for('add_medicine') }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Medicine Name</label>
                <input type="text" name="medicine_name" class="form-control" placeholder="e.g. Paracetamol" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Dosage</label>
                <input type="text" name="dosage" class="form-control" placeholder="e.g. 500mg, 1 tablet">
            </div>

            <div class="col-md-6">
                <label class="form-label">Time</label>
                <input type="time" name="time" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Frequency</label>
                <div class="freq-check">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="frequency" value="Morning" id="fmorning">
                        <label class="form-check-label" for="fmorning">Morning</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="frequency" value="Afternoon" id="fafternoon">
                        <label class="form-check-label" for="fafternoon">Afternoon</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="frequency" value="Night" id="fnight">
                        <label class="form-check-label" for="fnight">Night</label>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ today }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control">
            </div>

            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="Any special instructions..."></textarea>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-medi px-4"><i class="fa-solid fa-floppy-disk me-2"></i>Save Medicine</button>
            <a href="{{ url_for('view_medicines') }}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
