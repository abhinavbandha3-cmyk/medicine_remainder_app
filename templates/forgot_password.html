{% extends "layout.html" %}
{% block title %}Forgot Password - Smart Medicine Reminder{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-key"></i></div>
        <div class="auth-title">Forgot Password</div>
        <div class="auth-subtitle">Enter your username and we'll help you reset it</div>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <button type="submit" class="btn btn-medi w-100">Send Reset Instructions</button>
        </form>

        <div class="auth-footer-note">
            <a href="{{ url_for('login') }}"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
